name: Bug report
description: Report a problem with a released build of MK64 Native Rebuild.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you file, check the support window in the release notes:
        only the latest MINOR release and the version inside its window are supported.
        A report on an unsupported version is closed as unsupported, not ignored.

        Do not paste a game image, an extracted asset or a key into this issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version you are running, exactly as tagged, for example v0.2.1. See the support window before filing.
      placeholder: v0.2.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Local logs or crash report
      description: Paste text only. Do not attach a game image, an extracted asset or a key.
    validations:
      required: false
  - type: checkboxes
    id: support
    attributes:
      label: Support window
      options:
        - label: I checked the support window and my version is inside it.
          required: true
